# Method E LM backend on Blind-A, but response generation runs on the OpenAI API (GPT-5.4)
# instead of the local Qwen3-8B. Same retriever (anchor_bge_bm25_cf) + dataset as the Qwen E config;
# only the lm_model block differs (version "api" -> OPENAI_MODEL). No local LLM is loaded.
lm_model:
  version: "api"                    # "api" = OPENAI_MODEL (remote); "v2" = local Qwen3-8B (method E)
  model_name: "gpt-5.4"             # must be a real OpenAI model ID (passed to the API verbatim)
  temperature: 0.8
  max_new_tokens: 128               # sent to the API as max_tokens
  system_prompt: "natural"          # replace the checklist block with NATURAL_RESPONSE_PROMPT
  frequency_penalty: 0.4            # OpenAI analogue of HF repetition_penalty; raises LexDiv (tune 0.3-0.5)
  presence_penalty: 0.0
retrieval_type: "anchor_bge_bm25_cf"   # anchor_cf + BM25 sparse channel fused with RRF (best retriever)
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
  - "test_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
# anchor_cf only: blindset has no goal_progress_assessment labels, so false (all past music tracks are positives).
anchor_feedback: false
# The LLM reranker needs logits, which the API backend cannot provide -> keep it off.
reranker:
  enabled: false                     # false = keep retrieval order (version A)
  type: "llm"
  method: "pointwise"
  n_candidates: 20
  topk: 20
  max_tags: 3
  chunk_size: 8
  rank_blend: 0.3
  temperature: 0.3
