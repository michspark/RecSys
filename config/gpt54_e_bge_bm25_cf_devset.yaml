# Method E LM backend on devset, response generation runs on the OpenAI API (GPT-5.4) instead of
# local Qwen3-8B. Same retriever (anchor_bge_bm25_cf) + dataset as the Qwen E devset config; only the
# lm_model block differs (version "api" -> OPENAI_MODEL). Purpose: measure LexDiv (Distinct-2) locally
# via evaluate_devset.py, since blindset has no local scoring. tid = gpt54_e_bge_bm25_cf_devset.
lm_model:
  version: "api"                    # "api" = OPENAI_MODEL (remote); "v2" = local Qwen3-8B (method E)
  model_name: "gpt-5.4"             # must be a real OpenAI model ID (passed to the API verbatim)
  temperature: 0.8
  max_new_tokens: 128               # sent to the API as max_tokens
  system_prompt: "natural"          # replace the checklist block with NATURAL_RESPONSE_PROMPT
  frequency_penalty: 0.4            # raises LexDiv; toggle 0.0 <-> 0.4 to isolate its effect
  presence_penalty: 0.0
retrieval_type: "anchor_bge_bm25_cf"   # anchor_cf + BM25 sparse channel fused with RRF (best retriever)
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
  - "test_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
# anchor_cf only: use goal_progress_assessment labels to pick positive tracks (devset). Must be false on blindset.
anchor_feedback: true
# The LLM reranker needs logits, which the API backend cannot provide -> keep it off.
reranker:
  enabled: false                     # keep retrieval order (version A)
  type: "llm"
  method: "pointwise"
  n_candidates: 20
  topk: 20
  max_tags: 3
  chunk_size: 8
  rank_blend: 0.3
  temperature: 0.3
