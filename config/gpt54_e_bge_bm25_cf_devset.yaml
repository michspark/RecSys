# Method E LM backend on devset, response generation runs on the OpenAI API (GPT-5.4) instead of
# local Qwen3-8B. Same retriever (anchor_bge_bm25_cf) + dataset as the Qwen E devset config; only the
# lm_model block differs (version "api" -> OPENAI_MODEL). Purpose: measure LexDiv (Distinct-2) locally
# via evaluate_devset.py, since blindset has no local scoring. tid = gpt54_e_bge_bm25_cf_devset.
lm_model:
  version: "api"                    # "api" = OPENAI_MODEL (remote); "v2" = local Qwen3-8B (method E)
  model_name: "gpt-5.4"             # ⚠️ 실제 OpenAI 모델 ID로 맞출 것 (코드는 이 문자열을 그대로 API에 전달)
  temperature: 0.8
  max_new_tokens: 128               # API에는 max_tokens로 전달됨
  system_prompt: "natural"          # checklist 블록을 NATURAL_RESPONSE_PROMPT로 교체
  frequency_penalty: 0.4            # LexDiv↑용. 효과 분리 측정 시 0.0 ↔ 0.4 토글
  presence_penalty: 0.0
retrieval_type: "anchor_bge_bm25_cf"   # anchor_cf + BM25 sparse 채널을 RRF로 융합 (best 검색기)
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
  - "test_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
# anchor_cf 전용: 긍정 판정에 goal_progress_assessment 라벨 사용(devset 재현). blindset은 false.
anchor_feedback: true
# LLM reranker는 API 백엔드에선 쓸 수 없음(logit 접근 불가) → 반드시 off 유지.
reranker:
  enabled: false                     # api 백엔드 + 로컬 LexDiv 측정용 (retrieval 그대로 = version A)
  type: "llm"
  method: "pointwise"
  n_candidates: 20
  topk: 20
  max_tags: 3
  chunk_size: 8
  rank_blend: 0.3
  temperature: 0.3
