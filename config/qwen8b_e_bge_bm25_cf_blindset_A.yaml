# Method E LM backend (LLAMA_MODEL_v2) on Blind-A: Qwen3-8B + instruct + sampling + natural prompt.
# Same lm_model block as the devset E config; only the dataset + anchor_feedback differ for blindset.
lm_model:
  version: "v2"                     # "v1" = LLAMA_MODEL, "v2" = LLAMA_MODEL_v2 (method E)
  model_name: "Qwen/Qwen3-8B"
  attn_implementation: "sdpa"       # memory-light attention so Qwen3-8B fits 24GB
  prompt_mode: "instruct"           # "instruct" | "inject"
  do_sample: true                   # sampling decoding
  temperature: 0.8
  top_p: 0.8
  repetition_penalty: 1.2           # >1.0 penalizes already-seen tokens to curb repetition
  no_repeat_ngram_size: 3           # forbid any 3-gram from repeating in one response (0 = off)
  max_new_tokens: 128
  system_prompt: "natural"          # "natural" swaps the checklist response_generation block
retrieval_type: "anchor_bge_bm25_cf"   # anchor_cf + BM25 sparse channel fused with RRF (best retriever)
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Blind-A"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
  - "test_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
# anchor_cf only: blindset has no goal_progress_assessment labels, so false (all past music tracks are positives).
anchor_feedback: false
# LLM reranker (pointwise): self.lm (Qwen3-8B) reorders the retrieval candidates by per-track p(Yes).
# Blind-A is 80 single-turn sessions, so running it in-pipeline fits in memory.
reranker:
  enabled: false                     # false = keep retrieval order (version A)
  type: "llm"
  method: "pointwise"               # pointwise | listwise
  n_candidates: 20                  # rerank only the top-20 (ranks 21-50 untouched)
  topk: 20
  max_tags: 3
  chunk_size: 8                     # batch size of the pointwise forward pass
  rank_blend: 0.3                   # final rank = 0.7*retrieval + 0.3*LLM (conservative)
  temperature: 0.3                  # used only in listwise mode
