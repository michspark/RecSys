# Method E LM backend (LLAMA_MODEL_v2): Qwen3-8B + instruct prompt mode + sampling + natural prompt.
# All LM settings live under `lm_model`. Top-level lm_type/attn_implementation are intentionally
# omitted: when lm_model is present it carries the LM config, and the run scripts fall back to
# defaults for the (now unused) top-level fields.
lm_model:
  version: "v2"                     # "v1" = LLAMA_MODEL, "v2" = LLAMA_MODEL_v2 (method E)
  model_name: "Qwen/Qwen3-8B"
  attn_implementation: "sdpa"       # memory-light attention so Qwen3-8B fits 24GB
  prompt_mode: "instruct"           # "instruct" | "inject"
  do_sample: true                   # sampling decoding
  temperature: 0.8
  top_p: 0.9
  max_new_tokens: 128
  system_prompt: "natural"          # "natural" swaps the checklist response_generation block
retrieval_type: "anchor_bge_bm25_cf"   # anchor_cf + BM25 sparse channel fused with RRF (best retriever)
test_dataset_name: "talkpl-ai/TalkPlayData-Challenge-Dataset"
item_db_name: "talkpl-ai/TalkPlayData-Challenge-Track-Metadata"
user_db_name: "talkpl-ai/TalkPlayData-Challenge-User-Metadata"
track_split_types:
  - "all_tracks"
  - "test_tracks"
user_split_types:
  - "all_users"
corpus_types:
  - "track_name"
  - "artist_name"
  - "album_name"
  - "tag_list"
cache_dir: "./cache"
device: "cuda"
# anchor_cf only: use goal_progress_assessment labels to pick positive tracks (devset). Must be false on blindset.
anchor_feedback: true
# LLM reranker. In-pipeline reranking OOMs on a 24GB GPU (~23GB resident), so it stays off here;
# run_inference_devset.py still dumps the pre-rerank top-50 pool for a separate rerank pass.
reranker:
  enabled: false                    # off in-pipeline to avoid OOM
  type: "llm"                       # llm | none
  n_candidates: 50                  # number of retrieval candidates to rerank
  topk: 20                          # final list size (eval goes up to nDCG@20)
  temperature: 0.3                  # low temperature for stable reranking (separate from response 0.8)
  max_new_tokens: 128               # enough for 20 indices
  reuse_response_llm: true          # informational only: the code always reuses self.lm
